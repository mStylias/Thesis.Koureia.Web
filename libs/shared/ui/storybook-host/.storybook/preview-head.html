<style>
  /* Let inline popovers (Select, MultiSelect, …) render in full inside Docs
     examples instead of being clipped with a scrollbar. An observer set up in
     preview.ts then grows the `.sb-example` container to contain the open
     popover, pushing the following content down instead of overlapping it.
     (The observer lives in preview.ts, not an inline script here, because
     Storybook injects this file via innerHTML, which does not run scripts.) */
  .sbdocs-preview,
  .sbdocs-preview .docs-story {
    overflow: visible !important;
  }
</style>
