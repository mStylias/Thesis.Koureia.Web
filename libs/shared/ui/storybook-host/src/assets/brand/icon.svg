<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 310" width="310" height="310" role="img" aria-label="Placeholder brand mark">
  <!--
    Brand-neutral stand-in for a tenant logo in Storybook. Deliberately not
    Koureia's mark: this Storybook documents the shared design system, which
    belongs to no single brand.

    Square, because BrandConfig.logo is contracted square. Mid-tone greys so it
    reads on both the light and dark toolbar themes — an external SVG cannot
    inherit CSS custom properties from the page, so no tokens here.
  -->
  <rect width="310" height="310" rx="68" fill="#8c8c8c" />
  <circle cx="155" cy="155" r="74" fill="none" stroke="#f2f2f2" stroke-width="16" />
  <circle cx="155" cy="155" r="20" fill="#f2f2f2" />
</svg>
