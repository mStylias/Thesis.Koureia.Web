<!--
  Required is exposed as aria-required, never the native attribute: the
  native one blocks the submit event outright and raises an OS-locale
  bubble over the translated message this control already renders.
-->
<input
  #tel
  type="tel"
  class="phone-input-input"
  autocomplete="tel"
  [attr.id]="inputId() || null"
  [attr.name]="name() || null"
  [disabled]="disabled()"
  [attr.aria-required]="required() ? true : null"
  [attr.aria-label]="
    ariaLabel() ||
    (inputId() || ariaLabelledby() ? null : ('phoneInput.label' | uiCopy | transloco))
  "
  [attr.aria-labelledby]="ariaLabelledby() || null"
  [attr.aria-invalid]="invalid() ? true : null"
  [attr.aria-describedby]="describedBy()"
  (input)="onInput()"
  (countrychange)="onCountryChange()"
/>
@if (showError()) {
  <p
    class="phone-input-error"
    [id]="errorId"
    animate.enter="phone-input-error-enter"
    animate.leave="phone-input-error-leave"
  >
    {{ firstError()?.message || errorKey() | uiCopy | transloco }}
  </p>
}
