# Ελληνικά, δεύτερο ενικό πρόσωπο, όπως το υπόλοιπο προϊόν. Η βάση του Keycloak μιλάει στον
# πληθυντικό και δεν χρησιμοποιείται εδώ.
#
# ΠΡΟΣΟΧΗ: UTF-8, και MessageFormat. Διπλασίασε την απόστροφο ('') σε κάθε κείμενο με {0}.

emailFooterAutomated=Αυτόματο μήνυμα. Μην απαντήσεις σε αυτό.

passwordResetSubject=Επαναφορά κωδικού στο Koureia
passwordResetPreheader=Μέσα θα βρεις τον σύνδεσμο για να ορίσεις νέο κωδικό.
passwordResetHeading=Επαναφορά κωδικού
passwordResetLead=Κάποιος ζήτησε επαναφορά του κωδικού για τον λογαριασμό σου στο {0}. Αν ήσουν εσύ, όρισε νέο κωδικό παρακάτω.
passwordResetCta=Όρισε νέο κωδικό
passwordResetExpiry=Ο σύνδεσμος λειτουργεί μία φορά και λήγει σε {0}.
passwordResetFallback=Αν δεν λειτουργεί το κουμπί, άνοιξε αυτή τη διεύθυνση στο πρόγραμμα περιήγησης:
passwordResetIgnore=Αν δεν το ζήτησες εσύ, αγνόησε αυτό το μήνυμα. Ο κωδικός σου μένει ο ίδιος.

# Το {0} είναι ο πάροχος όπως τον ξέρει ο αναγνώστης («Google»). Είναι το μόνο όρισμα που
# δίνει το Keycloak στο θέμα του μηνύματος.
identityProviderLinkSubject=Σύνδεση του λογαριασμού σου στο Koureia με {0}
identityProviderLinkPreheader=Μέσα θα βρεις τον σύνδεσμο για να ολοκληρώσεις τη σύνδεση των λογαριασμών.
identityProviderLinkHeading=Σύνδεση με τον λογαριασμό {0}
identityProviderLinkLead=Παραλήφθηκε αίτημα για τη σύνδεση του λογαριασμού σου στο {0} με τον λογαριασμό {1} "{2}".
# Όταν ο πάροχος δεν επιστρέφει διεύθυνση. Η ίδια πρόταση, με ένα στοιχείο λιγότερο.
identityProviderLinkLeadPlain=Παραλήφθηκε αίτημα για τη σύνδεση του λογαριασμού σου στο {0} με τον λογαριασμό σου {1}.
identityProviderLinkAction=Αν υπέβαλες εσύ αυτό το αίτημα, πάτησε το παρακάτω κουμπί για να ολοκληρώσεις τη σύνδεση.
identityProviderLinkCta=Σύνδεση λογαριασμών
identityProviderLinkExpiry=Σημείωση: ο σύνδεσμος παραμένει ενεργός για {0}.
identityProviderLinkBenefit=Μόλις ολοκληρωθεί η σύνδεση, θα μπορείς να συνδέεσαι στο {0} με τον λογαριασμό σου {1}.
identityProviderLinkFallback=Αν δεν λειτουργεί το κουμπί, άνοιξε αυτή τη διεύθυνση στο πρόγραμμα περιήγησης:
identityProviderLinkIgnore=Αν δεν ζήτησες εσύ τη σύνδεση, αγνόησε αυτό το μήνυμα. Ο λογαριασμός σου παραμένει ασφαλής.

# Η γλώσσα αυτού του αρχείου, για να μπει σε σύνδεσμο μέσα σε πρότυπο. Το `.lang` του
# FreeMarker δεν είναι η γλώσσα που επιλέγει το Keycloak για το μήνυμα.
localeCode=el
