# Koureia email copy. Overrides and extends Keycloak's base email bundle.
#
# CAUTION: These are Java MessageFormat patterns. Double a literal apostrophe ('') in any string
# that also carries a {0}, or MessageFormat eats the apostrophe and the placeholder. Subjects go
# through MessageFormat too, so they avoid apostrophes.

emailFooterAutomated=This is an automated message. Please do not reply to it.

passwordResetSubject=Reset your Koureia password
passwordResetPreheader=Use the link inside to choose a new password.
passwordResetHeading=Reset your password
passwordResetLead=Someone asked to reset the password for your {0} account. If that was you, choose a new one below.
passwordResetCta=Choose a new password
passwordResetExpiry=The link can be used once, and expires in {0}.
passwordResetFallback=If the button does not work, open this address in your browser:
passwordResetIgnore=If you did not ask for this, ignore this message. Your password stays as it is.

# {0} is the provider as the reader knows it ("Google"), which is the only argument Keycloak
# passes to the subject.
identityProviderLinkSubject=Link your Koureia account with {0}
identityProviderLinkPreheader=Use the link inside to finish linking the two accounts.
identityProviderLinkHeading=Link your {0} account
identityProviderLinkLead=A request has been received to link your {0} account with the {1} account "{2}".
# Used when the provider sends back no address to name. Same sentence, one fact short.
identityProviderLinkLeadPlain=A request has been received to link your {0} account with your {1} account.
identityProviderLinkAction=If you submitted this request, use the button below to complete the connection.
identityProviderLinkCta=Link accounts
identityProviderLinkExpiry=Note: this link stays active for {0}.
identityProviderLinkBenefit=Once connected, you can sign in to {0} with your {1} account.
identityProviderLinkFallback=If the button does not work, open this address in your browser:
identityProviderLinkIgnore=If you did not request this connection, ignore this message. Your account stays as it is.

# The language of this bundle, so a template can put it in a link. `.lang` is FreeMarker's
# idea of the locale and not Keycloak's resolved one, which is how the Greek mail once
# carried an English link.
localeCode=en
