<kc-auth-frame
  [title]="i18n.msgStr('updatePasswordTitle')"
  [description]="i18n.msgStr('updatePasswordDescription')"
>
  @if (globalError; as message) {
    <lib-banner class="message" tone="error" role="alert">
      <span [innerHTML]="message.summary"></span>
    </lib-banner>
  }

  <form
    #form
    id="kc-passwd-update-form"
    class="auth-form"
    method="post"
    [action]="kcContext.url.loginAction"
    novalidate
    (submit)="onSubmit($event)"
  >
    <div class="field">
      <label for="password-new">{{ i18n.msgStr('passwordNewLabel') }}</label>

      <lib-password-input
        inputId="password-new"
        name="password-new"
        autocomplete="new-password"
        feedback="side"
        required
        [rules]="passwordRules"
        [invalid]="hasError()"
        [ariaDescribedby]="hasError() ? 'password-error' : ''"
        [(value)]="password"
      />

      <!-- One field on screen, so the confirmation is the same value. It rides in the form
           instead of a submit handler, which keeps it correct for an Enter key press or a
           browser form restore. -->
      <input type="hidden" name="password-confirm" [value]="password()" />

      @if (hasError()) {
        <p id="password-error" class="field-error" aria-live="polite" [innerHTML]="error()"></p>
      }
    </div>

    <lib-checkbox inputId="logout-sessions" name="logout-sessions" [(value)]="logoutOtherSessions">
      {{ i18n.msgStr('logoutOtherSessions') }}
    </lib-checkbox>

    <button libButton type="submit" size="lg" [disabled]="submitting()">
      {{ i18n.msgStr('updatePasswordSubmit') }}
    </button>

    @if (canCancel) {
      <button
        libButton
        type="submit"
        variant="text"
        severity="secondary"
        size="lg"
        name="cancel-aia"
        value="true"
        [disabled]="submitting()"
      >
        {{ i18n.msgStr('doCancel') }}
      </button>
    }
  </form>
</kc-auth-frame>
