<kc-auth-frame [title]="i18n.msgStr('emailForgotTitle')" [description]="instruction()">
  @let messagesPerField = kcContext.messagesPerField;

  <!-- `@let`, not `@if (…; as message)`: `&&` returns its last operand, so the `as` form bound
       the boolean and the tone and text came out empty. `innerHTML` as a plain string, for the
       reason in `login.html`. -->
  @let message = kcContext.message;
  @if (message && !messagesPerField.existsError('username')) {
    <lib-banner
      class="message"
      [tone]="message.type"
      [attr.role]="message.type === 'error' ? 'alert' : 'status'"
    >
      <span [innerHTML]="message.summary"></span>
    </lib-banner>
  }

  <form
    class="auth-form"
    method="post"
    [action]="kcContext.url.loginAction"
    novalidate
    (submit)="submitting.set(true)"
  >
    <div class="field">
      <label for="username">{{ usernameLabel() }}</label>
      <input
        libInputText
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        [value]="kcContext.auth.attemptedUsername ?? ''"
        [invalid]="messagesPerField.existsError('username')"
        [attr.aria-describedby]="messagesPerField.existsError('username') ? 'username-error' : null"
      />

      @if (messagesPerField.existsError('username')) {
        <p
          id="username-error"
          class="field-error"
          aria-live="polite"
          [innerHTML]="messagesPerField.get('username')"
        ></p>
      }
    </div>

    <button libButton type="submit" size="lg" [disabled]="submitting()">
      {{ i18n.msgStr('doSubmit') }}
    </button>
  </form>

  <p class="auth-switch">
    <a [href]="kcContext.url.loginUrl">{{ i18n.msgStr('backToLoginLabel') }}</a>
  </p>
</kc-auth-frame>
